name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release win-x64
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_XMLDOC_MODE: skip
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify tag and project version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content -LiteralPath ./Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME stimmt nicht exakt mit Projektversion $version überein."
          }
          $releaseListJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw "Vorhandene Releases konnten nicht sicher geprüft werden (Exitcode $LASTEXITCODE)."
          }
          $releaseTags = @($releaseListJson | ConvertFrom-Json | ForEach-Object tagName)
          if ($releaseTags -ccontains $env:GITHUB_REF_NAME) {
            throw "Release $env:GITHUB_REF_NAME existiert bereits und wird nicht überschrieben."
          }

      - name: Reject tracked runtime secrets and payment data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $forbiddenNames = @(
            'config.ini', 'secrets.dat', 'transaction_journal.json',
            'receipt_counter.txt', 'receipt_templates.ini', '.env'
          )
          $tracked = @(git ls-files)
          $violations = @($tracked | Where-Object {
            $name = [IO.Path]::GetFileName($_)
            $forbiddenNames -contains $name -or $name -like '*.log' -or $name -like '*.download'
          })
          if ($violations.Count -gt 0) {
            throw "Verbotene Laufzeit-/Geheimnisdateien sind versioniert: $($violations -join ', ')"
          }

      - name: Verify generated brand icon
        shell: pwsh
        run: |
          ./build/Generate-Icon.ps1 | Out-Null
          git diff --exit-code -- assets/zvt2sumup.ico assets/zvt2sumup-logo.svg

      - name: Restore
        shell: pwsh
        run: dotnet restore ./Zvt2SumUp.slnx --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build ./Zvt2SumUp.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test ./tests/Zvt2SumUp.Tests/Zvt2SumUp.Tests.csproj -c Release --no-build

      - name: Publish gateway
        shell: pwsh
        run: >-
          dotnet publish ./src/Zvt2SumUp.Desktop/Zvt2SumUp.Desktop.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/gateway

      - name: Publish tools
        shell: pwsh
        run: >-
          dotnet publish ./src/Zvt2SumUp.Tools/Zvt2SumUp.Tools.csproj
          -c Release -r win-x64 --self-contained true --no-restore
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/tools

      - name: Assemble, smoke-test and seal release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = New-Item -ItemType Directory -Force -Path ./artifacts/package
          $release = New-Item -ItemType Directory -Force -Path ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/gateway/ZVT2SumUpGateway.exe -Destination $package.FullName
          Copy-Item -LiteralPath ./artifacts/tools/ZVT2SumUp.Tools.exe -Destination $package.FullName

          $files = @(Get-ChildItem -LiteralPath $package.FullName -File)
          $expected = @('ZVT2SumUp.Tools.exe', 'ZVT2SumUpGateway.exe')
          if ($files.Count -ne 2 -or (Compare-Object ($files.Name | Sort-Object) $expected)) {
            throw 'Das Paket muss exakt die beiden freigegebenen EXE-Dateien enthalten.'
          }
          foreach ($file in $files) {
            if ($file.Length -lt 1MB) { throw "$($file.Name) ist nicht self-contained." }
          }

          $gatewaySmoke = Start-Process -FilePath "$($package.FullName)\ZVT2SumUpGateway.exe" `
            -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($gatewaySmoke.ExitCode -ne 0) { throw 'Gateway-Smoke-Test fehlgeschlagen.' }
          $layoutSmoke = Start-Process -FilePath "$($package.FullName)\ZVT2SumUpGateway.exe" `
            -ArgumentList '--layout-smoke-test' -Wait -PassThru -NoNewWindow
          if ($layoutSmoke.ExitCode -ne 0) { throw 'Layout-Smoke-Test bei 960 x 640 fehlgeschlagen.' }
          $serviceSmoke = Start-Process -FilePath "$($package.FullName)\ZVT2SumUpGateway.exe" `
            -ArgumentList '--service-smoke-test' -Wait -PassThru -NoNewWindow
          if ($serviceSmoke.ExitCode -ne 0) { throw 'Service-Smoke-Test fehlgeschlagen.' }
          & "$($package.FullName)\ZVT2SumUp.Tools.exe" help
          if ($LASTEXITCODE -ne 0) { throw 'Tools-Smoke-Test fehlgeschlagen.' }

          $cashStart = [Diagnostics.ProcessStartInfo]::new()
          $cashStart.FileName = "$($package.FullName)\ZVT2SumUp.Tools.exe"
          $cashStart.UseShellExecute = $false
          $cashStart.CreateNoWindow = $true
          $cashStart.RedirectStandardInput = $true
          $cashStart.RedirectStandardOutput = $true
          $cashStart.RedirectStandardError = $true
          $cash = [Diagnostics.Process]::new()
          $cash.StartInfo = $cashStart
          try {
            if (-not $cash.Start()) { throw 'Kassensimulator konnte nicht gestartet werden.' }
            $cashOut = $cash.StandardOutput.ReadToEndAsync()
            $cashErr = $cash.StandardError.ReadToEndAsync()
            $cash.StandardInput.WriteLine('0')
            $cash.StandardInput.Close()
            if (-not $cash.WaitForExit(15000)) { try { $cash.Kill() } catch {}; throw 'Kassensimulator-Smoke-Test lief in ein Timeout.' }
            $cashText = $cashOut.GetAwaiter().GetResult() + $cashErr.GetAwaiter().GetResult()
            if ($cash.ExitCode -ne 0 -or -not $cashText.Contains('ZVT2SumUp KASSENSIMULATOR') -or -not $cashText.Contains('Zahlung senden')) {
              throw 'Standardstart des Kassensimulators ist unvollständig.'
            }
          } finally { $cash.Dispose() }

          $archive = Join-Path $release.FullName 'ZVT2SumUp-win-x64.zip'
          Compress-Archive -LiteralPath $files.FullName -DestinationPath $archive -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object FullName | Sort-Object)
            if ($names.Count -ne 2 -or (Compare-Object $names $expected)) {
              throw 'Release-ZIP enthält nicht exakt die beiden erwarteten Stammdateien.'
            }
          } finally { $zip.Dispose() }

          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllLines(
            (Join-Path $release.FullName 'checksums.sha256'),
            @("$hash  ZVT2SumUp-win-x64.zip"),
            [Text.UTF8Encoding]::new($false))
          "- ``ZVT2SumUp-win-x64.zip``: ``$hash``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload sealed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ZVT2SumUp-${{ github.ref_name }}-release-assets
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME `
            ./artifacts/release/ZVT2SumUp-win-x64.zip `
            ./artifacts/release/checksums.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "ZVT2SumUp $env:GITHUB_REF_NAME" `
            --generate-notes
